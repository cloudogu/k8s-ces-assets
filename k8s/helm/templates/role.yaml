# Role Definition: warp menu role is responsible for updating the warp menu

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-ces-assets.name" . }}-nginx-role
  labels:
  {{- include "k8s-ces-assets.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - "events.k8s.io"
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - k8s.cloudogu.com
    resources:
      - warpmenuentries
      - components
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - k8s.cloudogu.com
    resources:
      - warpmenuentries/status
    verbs:
      - get
      - update
      - patch
