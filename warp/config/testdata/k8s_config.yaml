apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-ces-warp-config
  namespace: test
data:
  warp.yaml: |
    categories:
      Development Apps:
        order: 100
        displayName:
          de: "Anwendungen"
          en: "Applications"
      Support:
        order: 400
        displayName:
          de: "Support"
          en: "Support"
    defaultEntries:
      docsCloudoguComUrl:
        category: "Support"
        enabled: true
        displayName:
          de: "Cloudogu EcoSystem Dokumentation"
          en: "Cloudogu EcoSystem documentation"
        href: "https://docs.cloudogu.com"
      aboutCloudoguToken:
        category: "Support"
        enabled: true
        displayName:
          de: "Über Cloudogu"
          en: "About Cloudogu"
        href: "/info/about"
